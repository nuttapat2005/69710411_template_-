<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจองตั๋วเครื่องบิน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; }</style>
    
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

    <!-- Navbar -->
    <!-- Navbar -->
<header class="bg-emerald-600 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
        
        <!-- โลโก้เว็บไซต์ -->
        <div>
            <img class="img-fluid" src="img/gg3.png" alt="logo" width="120">
        </div>

        

        <!-- ลิงก์เมนูด้านขวา -->
        <nav class="flex items-center space-x-4 text-sm md:text-base">
            <a href="index.html" class="font-medium hover:underline opacity-80 hover:opacity-100">Home</a>
            <a href="hotel.html" class="font-medium hover:underline opacity-80 hover:opacity-100">จองที่พัก</a>
            <a href="flight.html" class="font-medium hover:underline opacity-80 hover:opacity-100">จองตั๋วเครื่องบิน</a>
            <a href="restaurant.html" class="font-medium hover:underline opacity-80 hover:opacity-100">จองร้านอาหาร</a>
            <button onclick="switchTab('my-bookings')" id="nav-bookings" class="font-medium hover:underline opacity-80">ประวัติการจอง (<span id="booking-count">0</span>)</button>
        </nav>

    </div>



 


</header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <!-- แท็บที่ 1: ค้นหาเที่ยวบิน -->
        <section id="tab-search" class="space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-md grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">เลือกปลายทาง</label>
                    <select id="search-dest" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none">
                        <!-- เติมข้อมูลด้วย JS -->
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">วันที่เดินทาง</label>
                    <input type="date" id="search-date" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">จำนวนที่นั่ง</label>
                    <input type="number" id="search-qty" min="1" value="1" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <button onclick="handleSearch()" class="w-full bg-emerald-600 text-white font-semibold py-2.5 rounded-lg hover:bg-emerald-700 transition shadow">ค้นหาเที่ยวบิน</button>
                </div>
            </div>

            <div id="search-results" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        </section>

        <!-- แท็บที่ 2: ประวัติการจอง -->
        <section id="tab-bookings" class="hidden space-y-6">
            <h2 class="text-2xl font-bold text-gray-800">ประวัติการจองตั๋วเครื่องบินของคุณ</h2>
            <div id="bookings-list" class="space-y-4"></div>
        </section>
    </main>

    <!-- Modal ชำระเงิน -->
    <div id="payment-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-xl">
            <h3 class="text-xl font-bold text-gray-800">💳 ยืนยันการชำระเงิน (ตั๋วเครื่องบิน)</h3>
            <div id="modal-details" class="bg-gray-50 p-4 rounded-xl text-sm space-y-2 border"></div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ-นามสกุล ผู้เดินทาง</label>
                <input type="text" id="customer-name" placeholder="กรอกชื่อของคุณ" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div class="flex gap-3 pt-2">
                <button onclick="closeModal()" class="w-1/2 bg-gray-200 text-gray-700 font-semibold py-2 rounded-lg hover:bg-gray-300 transition">ยกเลิก</button>
                <button onclick="confirmBooking()" class="w-1/2 bg-emerald-600 text-white font-semibold py-2 rounded-lg hover:bg-emerald-700 transition shadow">ชำระเงินทันที</button>
            </div>
        </div>
    </div>

    <script>
        const flightsData = [
            { id: 'F1', name: 'กรุงเทพ  ➔ ภูเก็ต ', location: 'ภูเก็ต', price: 1250, img: 'https://img.wongnai.com/p/800x0/2021/01/04/73764af2818646b6b7b39f35038ea83a.jpg' },
            { id: 'F2', name: 'กรุงเทพ  ➔ เชียงใหม่ ', location: 'เชียงใหม่', price: 1990, img: 'https://img.wongnai.com/p/800x0/2020/12/03/50a00ed174cf49538892f2192961fd29.jpg' },
            { id: 'F3', name: 'กรุงเทพ  ➔ เชียงราย ', location: 'เชียงราย', price: 2500, img: 'https://img.wongnai.com/p/800x0/2021/01/05/2a926f0b160b4f4bb24fc501dc850d99.jpg' },
            { id: 'F1', name: 'กรุงเทพ  ➔ ภูเก็ต ', location: 'ภูเก็ต', price: 1250, img: 'https://img.wongnai.com/p/800x0/2021/01/04/73764af2818646b6b7b39f35038ea83a.jpg' },
            { id: 'F2', name: 'กรุงเทพ  ➔ เชียงใหม่ ', location: 'เชียงใหม่', price: 1990, img: 'https://img.wongnai.com/p/800x0/2020/12/03/50a00ed174cf49538892f2192961fd29.jpg' },
            { id: 'F3', name: 'กรุงเทพ  ➔ เชียงราย ', location: 'เชียงราย', price: 2500, img: 'https://img.wongnai.com/p/800x0/2021/01/05/2a926f0b160b4f4bb24fc501dc850d99.jpg' },
        ];

        let myBookings = JSON.parse(localStorage.getItem('flight_bookings')) || [];
        let selectedItem = null;

        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        document.getElementById('search-date').valueAsDate = tomorrow;

        function updateDestinations() {
            const select = document.getElementById('search-dest');
            select.innerHTML = '<option value="">-- ทุกปลายทาง --</option>';
            const locations = [...new Set(flightsData.map(i => i.location))];
            locations.forEach(loc => {
                select.innerHTML += `<option value="${loc}">${loc}</option>`;
            });
        }

        function handleSearch() {
            const filter = document.getElementById('search-dest').value;
            const container = document.getElementById('search-results');
            let items = filter ? flightsData.filter(i => i.location === filter) : flightsData;

            container.innerHTML = '';
            if (items.length === 0) {
                container.innerHTML = `<p class="col-span-3 text-center text-gray-500 py-8">ไม่พบเที่ยวบิน</p>`;
                return;
            }

            items.forEach(item => {
                container.innerHTML += `
                    <div class="bg-white rounded-2xl overflow-hidden shadow hover:shadow-lg transition border flex flex-col justify-between">
                        <div>
                            <img src="${item.img}" class="w-full h-48 object-cover">
                            <div class="p-4 space-y-1">
                                <span class="text-xs bg-emerald-100 text-emerald-800 font-semibold px-2.5 py-0.5 rounded-full">${item.location}</span>
                                <h3 class="font-bold text-lg">${item.name}</h3>
                                <p class="text-emerald-600 font-bold text-xl">฿${item.price.toLocaleString()} <span class="text-xs text-gray-500 font-normal">/ ที่นั่ง</span></p>
                            </div>
                        </div>
                        <div class="p-4 pt-0">
                            <button onclick="openPaymentModal('${item.id}', '${item.name}', ${item.price})" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded-xl transition shadow">จองเที่ยวบินนี้</button>
                        </div>
                    </div>
                `;
            });
        }

        function openPaymentModal(id, name, price) {
            const date = document.getElementById('search-date').value;
            const qty = document.getElementById('search-qty').value;
            const total = price * qty;

            selectedItem = { id, name, price, date, qty, total };

            document.getElementById('modal-details').innerHTML = `
                <p><b>เที่ยวบิน:</b> ${name}</p>
                <p><b>วันที่เดินทาง:</b> ${date}</p>
                <p><b>จำนวนที่นั่ง:</b> ${qty} ที่นั่ง</p>
                <p class="text-base font-bold text-emerald-600 pt-2 border-t">ยอดรวม: ฿${total.toLocaleString()}</p>
            `;
            document.getElementById('payment-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('payment-modal').classList.add('hidden');
            selectedItem = null;
        }

        function confirmBooking() {
            const name = document.getElementById('customer-name').value.trim();
            if (!name) { alert('กรุณากรอกชื่อ'); return; }

            const newBooking = {
                bookingId: 'F-' + Math.floor(100000 + Math.random() * 900000),
                customerName: name,
                ...selectedItem,
                timestamp: new Date().toLocaleString()
            };

            myBookings.unshift(newBooking);
            localStorage.setItem('flight_bookings', JSON.stringify(myBookings));
            updateBadge();
            renderBookings();
            closeModal();
            alert('จองตั๋วเครื่องบินสำเร็จ!');
            switchTab('my-bookings');
        }

        function updateBadge() {
            document.getElementById('booking-count').innerText = myBookings.length;
        }

        function renderBookings() {
            const container = document.getElementById('bookings-list');
            container.innerHTML = '';
            if (myBookings.length === 0) {
                container.innerHTML = `<div class="bg-white p-8 rounded-2xl shadow text-center text-gray-500">ยังไม่มีประวัติการจองตั๋วเครื่องบิน</div>`;
                return;
            }

            myBookings.forEach(b => {
                container.innerHTML += `
                    <div class="bg-white p-6 rounded-2xl shadow border flex justify-between items-center">
                        <div>
                            <span class="bg-green-100 text-green-800 text-xs font-bold px-2 py-0.5 rounded-full">ยืนยันแล้ว</span>
                            <h3 class="font-bold text-lg mt-1">${b.name}</h3>
                            <p class="text-sm text-gray-600">ผู้เดินทาง: ${b.customerName} | วันที่: ${b.date} | จำนวน: ${b.qty} ที่นั่ง</p>
                        </div>
                        <div class="text-right">
                            <span class="text-emerald-600 font-bold text-xl">฿${b.total.toLocaleString()}</span>
                            <br><button onclick="cancelBooking('${b.bookingId}')" class="text-red-500 text-xs font-semibold mt-1">ยกเลิก</button>
                        </div>
                    </div>
                `;
            });
        }

        function cancelBooking(id) {
            if (confirm('ยกเลิกการจองนี้?')) {
                myBookings = myBookings.filter(b => b.bookingId !== id);
                localStorage.setItem('flight_bookings', JSON.stringify(myBookings));
                updateBadge();
                renderBookings();
            }
        }

        function switchTab(tab) {
            const s = document.getElementById('tab-search');
            const b = document.getElementById('tab-bookings');
            if (tab === 'search') {
                s.classList.remove('hidden'); b.classList.add('hidden');
            } else {
                s.classList.add('hidden'); b.classList.remove('hidden');
            }
        }

        updateDestinations();
        handleSearch();
        updateBadge();
    </script>
     
     
</body>
</html>
