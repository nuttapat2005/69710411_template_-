<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจองโรงแรมและตั๋วเครื่องบิน</title>
    <!-- Tailwind CSS สำหรับจัดแต่งหน้าจอ -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

    <!-- Navbar -->
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                ✈️ EasyBooking System
            </h1>
            <nav class="space-x-4">
                <button onclick="switchTab('search')" id="nav-search" class="font-medium hover:underline text-yellow-300">ค้นหาและจอง</button>
                <button onclick="switchTab('my-bookings')" id="nav-bookings" class="font-medium hover:underline opacity-80">ประวัติการจอง (<span id="booking-count">0</span>)</button>
            </nav>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">

        <!-- แท็บที่ 1: ค้นหาและจอง -->
        <section id="tab-search" class="space-y-6">
            <!-- ตัวเลือกประเภทการจอง -->
            <div class="flex justify-center gap-4">
                <button onclick="setCategory('hotel')" id="btn-hotel" class="px-6 py-2 rounded-full font-semibold bg-blue-600 text-white shadow transition">🏨 จองโรงแรม</button>
                <button onclick="setCategory('flight')" id="btn-flight" class="px-6 py-2 rounded-full font-semibold bg-white text-gray-700 shadow border hover:bg-gray-100 transition">✈️ จองตั๋วเครื่องบิน</button>
            </div>

            <!-- กล่องค้นหา -->
            <div class="bg-white p-6 rounded-2xl shadow-md grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                <div>
                    <label id="label-destination" class="block text-sm font-medium text-gray-700 mb-1">จุดหมายปลายทาง / โรงแรม</label>
                    <select id="search-dest" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                        <!-- รายการจะถูกเติมโดย JavaScript -->
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">วันที่เดินทาง / เช็คอิน</label>
                    <input type="date" id="search-date" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">จำนวนผู้เดินทาง / ห้อง</label>
                    <input type="number" id="search-qty" min="1" value="1" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <button onclick="handleSearch()" class="w-full bg-blue-600 text-white font-semibold py-2.5 rounded-lg hover:bg-blue-700 transition shadow">ค้นหาข้อมูล</button>
                </div>
            </div>

            <!-- ผลการค้นหา -->
            <div id="search-results" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- รายการจำลองจะแสดงตรงนี้ -->
            </div>
        </section>

        <!-- แท็บที่ 2: ประวัติการจอง -->
        <section id="tab-bookings" class="hidden space-y-6">
            <h2 class="text-2xl font-bold text-gray-800">ประวัติการจองของคุณ</h2>
            <div id="bookings-list" class="space-y-4">
                <!-- รายการจองจะแสดงตรงนี้ -->
            </div>
        </section>

    </main>

    <!-- Modal ชำระเงิน -->
    <div id="payment-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-xl">
            <h3 class="text-xl font-bold text-gray-800">💳 ยืนยันการชำระเงิน</h3>
            <div id="modal-details" class="bg-gray-50 p-4 rounded-xl text-sm space-y-2 border">
                <!-- รายละเอียดสรุป -->
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ-นามสกุล ผู้จอง</label>
                <input type="text" id="customer-name" placeholder="กรอกชื่อของคุณ" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div class="flex gap-3 pt-2">
                <button onclick="closeModal()" class="w-1/2 bg-gray-200 text-gray-700 font-semibold py-2 rounded-lg hover:bg-gray-300 transition">ยกเลิก</button>
                <button onclick="confirmBooking()" class="w-1/2 bg-green-600 text-white font-semibold py-2 rounded-lg hover:bg-green-700 transition shadow">ชำระเงินทันที</button>
            </div>
        </div>
    </div>

    <!-- JavaScript ภายในไฟล์เดียว -->
    <script>
        const mockData = {
            hotel: [
                { id: 'H1', name: 'Grand Luxury Hotel Bangkok', location: 'กรุงเทพฯ', price: 2500, img: 'https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=500&q=80' },
                { id: 'H2', name: 'Sea Breeze Resort Phuket', location: 'ภูเก็ต', price: 4200, img: 'https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&fit=crop&w=500&q=80' },
                { id: 'H3', name: 'Mountain View Chiang Mai', location: 'เชียงใหม่', price: 1800, img: 'https://images.unsplash.com/photo-1590490360182-c33d57733427?auto=format&fit=crop&w=500&q=80' }
            ],
            flight: [
                { id: 'F1', name: 'Bangkok (BKK) ➔ Phuket (HKT)', location: 'ภูเก็ต', price: 1250, img: 'https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=500&q=80' },
                { id: 'F2', name: 'Bangkok (DMK) ➔ Chiang Mai (CNX)', location: 'เชียงใหม่', price: 990, img: 'https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?auto=format&fit=crop&w=500&q=80' },
                { id: 'F3', name: 'Bangkok (BKK) ➔ Tokyo (NRT)', location: 'โตเกียว', price: 12500, img: 'https://images.unsplash.com/photo-1503899036084-c55cdd92da26?auto=format&fit=crop&w=500&q=80' }
            ]
        };

        let currentCategory = 'hotel';
        let myBookings = [];
        let selectedItemForBooking = null;

        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        const dateInput = document.getElementById('search-date');
        if (dateInput) {
            dateInput.valueAsDate = tomorrow;
        }

        function setCategory(category) {
            currentCategory = category;
            
            const btnHotel = document.getElementById('btn-hotel');
            const btnFlight = document.getElementById('btn-flight');
            const labelDest = document.getElementById('label-destination');

            if (category === 'hotel') {
                btnHotel.className = "px-6 py-2 rounded-full font-semibold bg-blue-600 text-white shadow transition";
                btnFlight.className = "px-6 py-2 rounded-full font-semibold bg-white text-gray-700 shadow border hover:bg-gray-100 transition";
                labelDest.innerText = "เลือกโรงแรม / จังหวัด";
            } else {
                btnFlight.className = "px-6 py-2 rounded-full font-semibold bg-blue-600 text-white shadow transition";
                btnHotel.className = "px-6 py-2 rounded-full font-semibold bg-white text-gray-700 shadow border hover:bg-gray-100 transition";
                labelDest.innerText = "เลือกเที่ยวบิน / เส้นทาง";
            }

            updateDestinations();
            handleSearch();
        }

        function updateDestinations() {
            const select = document.getElementById('search-dest');
            if (!select) return;
            
            select.innerHTML = '<option value="">-- ทุกสถานที่ --</option>';
            const items = mockData[currentCategory];
            const locations = [...new Set(items.map(i => i.location))];
            
            locations.forEach(loc => {
                select.innerHTML += `<option value="${loc}">${loc}</option>`;
            });
        }

        function handleSearch() {
            const destFilterElement = document.getElementById('search-dest');
            const container = document.getElementById('search-results');
            if (!container) return;

            const destFilter = destFilterElement ? destFilterElement.value : '';
            let items = mockData[currentCategory];
            if (destFilter) {
                items = items.filter(i => i.location === destFilter);
            }

            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = `<p class="col-span-3 text-center text-gray-500 py-8">ไม่พบข้อมูลที่คุณค้นหา</p>`;
                return;
            }

            items.forEach(item => {
                container.innerHTML += `
                    <div class="bg-white rounded-2xl overflow-hidden shadow hover:shadow-lg transition border flex flex-col justify-between">
                        <div>
                            <img src="${item.img}" alt="${item.name}" class="w-full h-48 object-cover">
                            <div class="p-4 space-y-1">
                                <span class="text-xs bg-blue-100 text-blue-800 font-semibold px-2.5 py-0.5 rounded-full">${item.location}</span>
                                <h3 class="font-bold text-lg text-gray-800">${item.name}</h3>
                                <p class="text-blue-600 font-bold text-xl">฿${item.price.toLocaleString()} <span class="text-xs text-gray-500 font-normal">/ หน่วย</span></p>
                            </div>
                        </div>
                        <div class="p-4 pt-0">
                            <button onclick="openPaymentModal('${item.id}', '${item.name}', ${item.price})" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-xl transition shadow">
                                จองทันที
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function openPaymentModal(id, name, price) {
            const date = document.getElementById('search-date').value;
            const qty = document.getElementById('search-qty').value;
            const total = price * qty;

            selectedItemForBooking = {
                type: currentCategory,
                id,
                name,
                price,
                date,
                qty,
                total
            };

            document.getElementById('modal-details').innerHTML = `
                <p><b>รายการ:</b> ${name}</p>
                <p><b>ประเภท:</b> ${currentCategory === 'hotel' ? 'โรงแรม' : 'ตั๋วเครื่องบิน'}</p>
                <p><b>วันที่เดินทาง/เช็คอิน:</b> ${date}</p>
                <p><b>จำนวน:</b> ${qty} ${currentCategory === 'hotel' ? 'ห้อง' : 'ที่นั่ง'}</p>
                <p class="text-base font-bold text-blue-600 pt-2 border-t">ยอดชำระรวม: ฿${total.toLocaleString()}</p>
            `;

            document.getElementById('payment-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('payment-modal').classList.add('hidden');
            selectedItemForBooking = null;
        }

        function confirmBooking() {
            const customerNameInput = document.getElementById('customer-name');
            const customerName = customerNameInput ? customerNameInput.value.trim() : '';
            
            if (!customerName) {
                alert('กรุณากรอกชื่อ-นามสกุลผู้จอง');
                return;
            }

            const newBooking = {
                bookingId: 'BK-' + Math.floor(100000 + Math.random() * 900000),
                customerName,
                ...selectedItemForBooking,
                timestamp: new Date().toLocaleString()
            };

            myBookings.unshift(newBooking);
            updateBookingBadge();
            renderBookingsList();
            
            closeModal();
            alert('จองสำเร็จ! หมายเลขการจองของคุณคือ: ' + newBooking.bookingId);
            switchTab('my-bookings');
        }

        function updateBookingBadge() {
            const badge = document.getElementById('booking-count');
            if (badge) badge.innerText = myBookings.length;
        }

        function renderBookingsList() {
            const container = document.getElementById('bookings-list');
            if (!container) return;
            
            container.innerHTML = '';

            if (myBookings.length === 0) {
                container.innerHTML = `<div class="bg-white p-8 rounded-2xl shadow text-center text-gray-500">ยังไม่มีประวัติการจองในขณะนี้</div>`;
                return;
            }

            myBookings.forEach(b => {
                container.innerHTML += `
                    <div class="bg-white p-6 rounded-2xl shadow border flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div class="space-y-1">
                            <div class="flex items-center gap-2">
                                <span class="bg-green-100 text-green-800 text-xs font-bold px-2.5 py-0.5 rounded-full">ยืนยันแล้ว</span>
                                <span class="text-xs text-gray-400">ID: ${b.bookingId}</span>
                            </div>
                            <h3 class="font-bold text-lg text-gray-800">${b.name}</h3>
                            <p class="text-sm text-gray-600">ผู้จอง: <span class="font-medium text-gray-800">${b.customerName}</span> | วันที่: ${b.date} | จำนวน: ${b.qty} ${b.type === 'hotel' ? 'ห้อง' : 'ที่นั่ง'}</p>
                            <p class="text-xs text-gray-400">ทำรายการเมื่อ: ${b.timestamp}</p>
                        </div>
                        <div class="text-right w-full md:w-auto flex md:flex-col justify-between items-center md:items-end">
                            <span class="text-blue-600 font-bold text-xl">฿${b.total.toLocaleString()}</span>
                            <button onclick="cancelBooking('${b.bookingId}')" class="text-red-500 hover:text-red-700 text-xs font-semibold mt-1">ยกเลิกการจอง</button>
                        </div>
                    </div>
                `;
            });
        }

        function cancelBooking(bookingId) {
            if (confirm('คุณต้องการยกเลิกการจองนี้ใช่หรือไม่?')) {
                myBookings = myBookings.filter(b => b.bookingId !== bookingId);
                updateBookingBadge();
                renderBookingsList();
            }
        }

        function switchTab(tabName) {
            const tabSearch = document.getElementById('tab-search');
            const tabBookings = document.getElementById('tab-bookings');
            const navSearch = document.getElementById('nav-search');
            const navBookings = document.getElementById('nav-bookings');

            if (!tabSearch || !tabBookings) return;

            if (tabName === 'search') {
                tabSearch.classList.remove('hidden');
                tabBookings.classList.add('hidden');
                if (navSearch) navSearch.className = "font-medium hover:underline text-yellow-300";
                if (navBookings) navBookings.className = "font-medium hover:underline opacity-80";
            } else {
                tabSearch.classList.add('hidden');
                tabBookings.classList.remove('hidden');
                if (navBookings) navBookings.className = "font-medium hover:underline text-yellow-300";
                if (navSearch) navSearch.className = "font-medium hover:underline opacity-80";
            }
        }

        updateDestinations();
        handleSearch();
    </script>
</body>
</html>
